[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epilepsy-warning"
version = "0.2.0"
description = "Standards-explicit detection of flashing and saturated-red content in GIFs and videos"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "imageio>=2.31.0",
    "imageio-ffmpeg>=0.4.9",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video",
]

[project.scripts]
epilepsy-scan = "epilepsy_warning.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.6", "line-profiler>=5.0.2"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/epilepsy_warning"]
