[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epilepsy-warning"
version = "0.2.0"
description = "Standards-explicit detection of flashing and saturated-red content in GIFs and videos"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
keywords = ["epilepsy", "photosensitive", "flash", "gif", "video", "wcag", "accessibility"]
authors = [
    { name = "Vuks", email = "vuks.official@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
urls = { Homepage = "https://github.com/Vuks69/epilepsy-warning", Repository = "https://github.com/Vuks69/epilepsy-warning" }
dependencies = [
    "imageio>=2.31.0",
    "imageio-ffmpeg>=0.4.9",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
]

[project.scripts]
epilepsy-scan = "epilepsy_warning.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.13", "pytest>=8", "pytest-cov>=5", "line-profiler>=5.0.2", "hypothesis>=6.0"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

# mypy: check the library's own code for type regressions. Third-party stubs
# (numpy, imageio, line-profiler) are best-effort, so tolerate missing/loose
# stubs we do not control. warn_unused_ignores is left off on purpose: the
# optional line-profiler import is intentionally ignored only when that optional
# dependency is absent.
[tool.mypy]
warn_redundant_casts = true
ignore_missing_imports = true

# pytest runs the existing stdlib unittest tests unchanged, and pytest-cov
# measures coverage over the library. The synthetic suite excludes the
# network-backed golden-media module (tests/test_golden_media.py); coverage is
# reported as a guard, not a hard CI threshold - see the CI note.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["epilepsy_warning"]

[tool.coverage.report]
# Lines without real logic (guard clauses, stubs) should not count against the
# coverage number. coverage.py already skips `# type: ignore` lines itself.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.hatch.build.targets.wheel]
packages = ["src/epilepsy_warning"]
