[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epilepsy-warning"
version = "0.1.0"
description = "Discord bot and CLI tool to detect photosensitive epilepsy triggers in GIFs and videos"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "discord.py>=2.3.0",
    "PyNaCl>=1.5.0",
    "aiohttp>=3.8.0",
    "imageio>=2.31.0",
    "imageio-ffmpeg>=0.4.9",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
epilepsy-scan = "epilepsy_warning.cli:main"
epilepsy-bot = "epilepsy_warning.bot:main"

[tool.hatch.build.targets.wheel]
packages = ["src/epilepsy_warning"]
